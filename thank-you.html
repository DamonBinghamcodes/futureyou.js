<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>FUTUREYOU - You're In</title>
    <meta name="description" content="You're subscribed. We'll notify you 24 hours before the store goes public.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./public/futureyou-logo-green.png">
    <link rel="apple-touch-icon" href="./public/futureyou-logo-green.png">

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <style>
        .thankyou-section {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeInUp var(--transition-slow) ease-out 0.1s both;
        }

        .thankyou-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--color-blue);
            margin-bottom: 1rem;
        }

        .thankyou-heading {
            font-size: clamp(1.75rem, 6vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: var(--color-black);
            margin-bottom: 1.25rem;
        }

        .thankyou-body {
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 400;
            line-height: 1.7;
            color: var(--color-gray-dark);
            margin-bottom: 2rem;
        }

        .thankyou-divider {
            width: 40px;
            height: 1px;
            background: var(--color-gray-medium);
            margin: 0 auto 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 0.875rem 2.5rem;
            border: 1px solid var(--color-gray-medium);
            border-radius: 50px;
            font-family: var(--font-primary);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-black);
            text-decoration: none;
            transition: all var(--transition-normal);
        }

        .back-link:hover {
            border-color: var(--color-blue);
            color: var(--color-blue);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <navbar class="site-navbar">
        <div class="header-meta">
            <span class="status-dot"></span>
            <span id="header-location">Gold Coast</span>
            <span id="header-temp">--°C</span>
            <span class="header-datetime"><span id="header-date">Loading date...</span><span id="header-time">Loading time...</span></span>
        </div>
    </navbar>

    <main class="gallery-container">
        <!-- Logo -->
        <header class="logo-section">
            <a href="index.html"><img src="./public/futureyou-logo-green.png" alt="Future You" class="brand-logo"></a>
        </header>

        <!-- Thank You Message -->
        <section class="thankyou-section">
            <p class="thankyou-label">Confirmed</p>
            <h1 class="thankyou-heading">Welcome to the Future You community.</h1>
            <div class="thankyou-divider"></div>
            <p class="thankyou-body">
                You are on our list.<br>
                We will send you an email with the password to unlock the store 24 hours before it goes live to the general public.
            </p>
            <a href="index.html" class="back-link">Back To The Archive.</a>
        </section>
